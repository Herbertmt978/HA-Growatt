name: HACS and Home Assistant validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hacs:
    runs-on: ubuntu-latest
    steps:
      - name: Validate HACS integration repository
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main, 23 September 2026
        with:
          category: integration

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate Home Assistant integration
        uses: home-assistant/actions/hassfest@58bff37c8947f690ace498be413a9b78d6f30f93 # master, 23 September 2026
