name: Dependabot auto-merge

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]

# This workflow reads only trusted metadata and PR paths. It never checks out
# or executes code from the pull request.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  manage:
    if: >-
      github.repository == 'Herbertmt978/HA-Growatt' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'dependabot/uv/')
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Clear stale automatic merge request
        if: github.event.action == 'synchronize' || github.event.action == 'converted_to_draft'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(gh pr view "$PR_URL" --json autoMergeRequest --jq '.autoMergeRequest != null')" == "true" ]]; then
            gh pr merge --disable-auto "$PR_URL"
          fi

      - name: Read Dependabot metadata
        if: github.actor == 'dependabot[bot]' && github.event.pull_request.draft == false
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ github.token }}

      - name: Check automatic merge policy
        if: github.actor == 'dependabot[bot]' && github.event.pull_request.draft == false
        id: policy
        shell: bash
        env:
          DEPENDENCY_GROUP: ${{ steps.metadata.outputs.dependency-group }}
          DEPENDENCY_NAMES: ${{ steps.metadata.outputs.dependency-names }}
          DIRECTORY: ${{ steps.metadata.outputs.directory }}
          GH_TOKEN: ${{ github.token }}
          MAINTAINER_CHANGES: ${{ steps.metadata.outputs.maintainer-changes }}
          NEW_VERSION: ${{ steps.metadata.outputs.new-version }}
          PACKAGE_ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
        run: |
          set -euo pipefail

          review_state="$(gh pr view "$PR_URL" --json reviewDecision,reviews | python -c '
          import json
          import sys
          from datetime import datetime, timezone

          data = json.load(sys.stdin)
          if not isinstance(data, dict) or "reviewDecision" not in data:
              raise SystemExit("Pull request review metadata is unavailable")
          decision = data["reviewDecision"]
          if decision not in (None, "", "APPROVED", "CHANGES_REQUESTED", "REVIEW_REQUIRED"):
              raise SystemExit("Pull request review decision is unknown")
          if decision == "CHANGES_REQUESTED":
              print("CHANGES_REQUESTED")
              raise SystemExit(0)

          reviews = data.get("reviews")
          if not isinstance(reviews, list) or len(reviews) >= 100:
              raise SystemExit("Pull request review history is missing or may be truncated")

          latest_by_author = {}
          for review in reviews:
              if not isinstance(review, dict):
                  raise SystemExit("Pull request review record is malformed")
              state = review.get("state")
              if state not in ("APPROVED", "CHANGES_REQUESTED", "DISMISSED", "COMMENTED", "PENDING"):
                  raise SystemExit("Pull request review state is unknown")
              author = review.get("author")
              login = author.get("login") if isinstance(author, dict) else None
              submitted_at = review.get("submittedAt")
              if not isinstance(login, str) or not login or not isinstance(submitted_at, str):
                  raise SystemExit("Pull request review identity or timestamp is missing")
              try:
                  submitted_at = datetime.fromisoformat(submitted_at.replace("Z", "+00:00"))
              except ValueError as error:
                  raise SystemExit("Pull request review timestamp is malformed") from error
              if submitted_at.tzinfo is None or submitted_at.utcoffset() is None:
                  raise SystemExit("Pull request review timestamp has no timezone")
              submitted_at = submitted_at.astimezone(timezone.utc)
              if state in ("COMMENTED", "PENDING"):
                  continue
              if state not in ("APPROVED", "CHANGES_REQUESTED", "DISMISSED"):
                  raise SystemExit("Pull request review state is not decisive")
              previous = latest_by_author.get(login)
              if previous is not None and submitted_at == previous[0] and state != previous[1]:
                  raise SystemExit("Pull request review ordering is ambiguous")
              if previous is None or submitted_at > previous[0]:
                  latest_by_author[login] = (submitted_at, state)

          if any(state == "CHANGES_REQUESTED" for _, state in latest_by_author.values()):
              print("CHANGES_REQUESTED")
          else:
              print("CLEAR")
          ' )"

          if [[ "$review_state" != "CLEAR" ]]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -n "$DEPENDENCY_GROUP" || "$MAINTAINER_CHANGES" != "false" ]]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$DIRECTORY" != "/" ]]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          case "$UPDATE_TYPE" in
            version-update:semver-patch|version-update:semver-minor) ;;
            *)
              echo "eligible=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          if [[ ! "$NEW_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          dependency_count=0
          dependency_name=""
          IFS=',' read -r -a dependencies <<< "$DEPENDENCY_NAMES"
          for dependency in "${dependencies[@]}"; do
            dependency="${dependency//[[:space:]]/}"
            [[ -z "$dependency" ]] && continue
            dependency_count=$((dependency_count + 1))
            dependency_name="$dependency"
          done

          if [[ "$dependency_count" -ne 1 ]]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          case "$PACKAGE_ECOSYSTEM:$dependency_name" in
            uv:ruff|uv:pytest)
              expected_files=$'pyproject.toml\nuv.lock'
              ;;
            *)
              echo "eligible=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          changed_files="$(gh pr diff "$PR_URL" --name-only | LC_ALL=C sort)"
          if [[ "$changed_files" != "$expected_files" ]]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "eligible=true" >> "$GITHUB_OUTPUT"

      - name: Queue eligible update for automatic merge
        if: steps.policy.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash --match-head-commit "$PR_HEAD_SHA" "$PR_URL"
