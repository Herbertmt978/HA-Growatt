<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-labelledby="title desc">
  <title id="title">Solar inverter</title>
  <desc id="desc">A wall-mounted solar inverter with a green status light and two power cables.</desc>
  <defs>
