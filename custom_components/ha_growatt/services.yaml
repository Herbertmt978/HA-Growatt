adopt_history:
  name: Preview or adopt history
  description: Check an unused historical sensor ID, then explicitly let an HA Growatt sensor use it. No statistics are deleted or merged. Compare the actual readings and make a backup before confirming.
  fields:
    target_entity:
      name: HA Growatt sensor
      required: true
      selector:
        entity:
          domain: sensor
    source_entity_id:
      name: Historical entity ID
      description: The old sensor must have been removed and its statistics retained.
      required: true
      example: sensor.previous_solar_energy_total
      selector:
        text:
    confirm:
      name: Apply the change
      default: false
      selector:
        boolean:
    same_measurement:
      name: Both sensors measure the same inverter and quantity
      description: Check daily versus lifetime energy and the measured circuit, not just the unit.
      default: false
      selector:
        boolean:
capture_evidence:
  name: Capture packet evidence
  description: Start a ten-minute private in-memory capture or return a shareable structure-only report. No packet bytes or readings appear in the report.
  fields:
    action:
      name: Action
      required: true
      selector:
        select:
          options:
            - label: Start capture
              value: start
            - label: Get shareable report
              value: report
identify_hardware:
  name: Identify hardware
  description: Read documented identity registers. Returns evidence without changing profiles or controls. The response is private.
  fields:
    device_id:
      name: Inverter
      required: true
      selector:
        device:
          integration: mqtt
read_registers:
  name: Read holding registers
  description: Read up to 32 holding registers. No writes. Returns private raw words and an optional comparison with the preceding read, valid for ten minutes on the same connection.
  fields:
    device_id:
      name: Inverter
      required: true
      selector:
        device:
          integration: mqtt
    start:
      name: First register address
      required: true
      selector:
        number:
          min: 0
          max: 65535
          mode: box
    count:
      name: Number of registers
      default: 1
      selector:
        number:
          min: 1
          max: 32
          mode: box
    previous:
      name: Previous snapshot
      description: Optional snapshot value returned by the preceding read of this device and range.
      selector:
        text:
