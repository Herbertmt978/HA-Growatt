services:
  ha-growatt:
    image: ghcr.io/herbertmt978/ha-growatt:0.2.0
    container_name: ha-growatt
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 96
    mem_limit: 256m
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,mode=1777
    ports:
      - "5279:5279"
    volumes:
      - ./ha-growatt.ini:/app/config/ha-growatt.ini:ro
    environment:
      TZ: Europe/London
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
