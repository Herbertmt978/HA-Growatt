name: HA Growatt
version: 0.3.2
slug: ha_growatt
description: Growatt readings through MQTT with Home Assistant discovery
url: https://github.com/Herbertmt978/HA-Growatt
arch: [amd64, aarch64]
startup: services
boot: auto
init: false
tmpfs: true
ingress: true
ingress_port: 8099
panel_icon: mdi:solar-power
panel_admin: true
hassio_api: true
homeassistant_api: true
services:
  - mqtt:want
ports:
  5279/tcp: 5279
ports_description:
  5279/tcp: Growatt datalogger connection
options:
  mode: proxy
  blockcmd: true
  cloud_fallback: true
  cloud_recovery_seconds: 300
  settings_refresh_seconds: 300
  buffered_events: true
  ha_features: true
  ha_controls: true
  time: server
  sendbuf: false
  invtype: default
  layout_strict: false
  layout_auto_family: true
  diagnostic_logging: false
  ha_plugin: true
  ha_entity_profile: v0_1_9_standard
  mqtt_host: core-mosquitto
  mqtt_port: 1883
  mqtt_user: ""
  mqtt_password: ""
  mqtt_retain: false
  mqtt_auto: true
  mqtt_tls: false
  restore_readings: true
  experimental_controls: false
  inverters: []
schema:
  mode: list(proxy)
  blockcmd: bool
  cloud_fallback: bool
  cloud_recovery_seconds: int(0,86400)
  settings_refresh_seconds: int(0,86400)
  buffered_events: bool
  ha_features: bool
  ha_controls: bool
  time: list(auto|server)
  sendbuf: bool
  invtype: list(default|sph|spf|spa|mod|min|tl3|max)
  layout_strict: bool
  layout_auto_family: bool
  diagnostic_logging: bool
  ha_plugin: bool
  ha_entity_profile: list(v0_1_9_standard|all)
  mqtt_host: str
  mqtt_port: port
  mqtt_user: str
  mqtt_password: password
  mqtt_retain: bool
  mqtt_auto: bool
  mqtt_tls: bool
  restore_readings: bool
  experimental_controls: bool
  inverters:
    - serial: str
      family: list(default|sph|spf|spa|mod|min|tl3|max)
      controls: list(auto|sph|spa|min_tl_xh|mod_tl3_xh)
      model: str?
      firmware: str?
